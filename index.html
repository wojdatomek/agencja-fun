<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agencja.fun — wkrótce online</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Outfit:wght@300;400;600&display=swap');

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: #0D0D0D;
  color: #E0E0E0;
  font-family: 'Outfit', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 40px 24px;
  position: relative;
  overflow: hidden;
}

body::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: radial-gradient(ellipse at center, rgba(108,43,217,0.12) 0%, transparent 60%);
  animation: pulse 8s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); opacity: 0.5; }
  50% { transform: scale(1.1); opacity: 1; }
}

.container {
  position: relative;
  z-index: 1;
  max-width: 600px;
}

.logo {
  font-family: 'Unbounded', sans-serif;
  font-size: 3.5rem;
  font-weight: 900;
  background: linear-gradient(135deg, #6C2BD9, #F5A623);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 8px;
  letter-spacing: -1px;
}

.logo .dot {
  color: #F5A623;
  -webkit-text-fill-color: #F5A623;
}

.tagline {
  font-size: 1rem;
  color: #888;
  letter-spacing: 4px;
  text-transform: uppercase;
  margin-bottom: 60px;
}

.status-badge {
  display: inline-block;
  padding: 8px 24px;
  border-radius: 100px;
  border: 1px solid rgba(108,43,217,0.4);
  background: rgba(108,43,217,0.1);
  color: #F5A623;
  font-size: 0.8rem;
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-bottom: 24px;
}

h1 {
  font-family: 'Unbounded', sans-serif;
  font-size: 2.2rem;
  font-weight: 700;
  margin-bottom: 16px;
  color: #fff;
}

p {
  font-size: 1.05rem;
  color: #888;
  line-height: 1.7;
  max-width: 450px;
  margin: 0 auto 60px;
}

.social-links {
  display: flex;
  gap: 20px;
  justify-content: center;
  flex-wrap: wrap;
}

.social-link {
  color: #666;
  text-decoration: none;
  font-size: 0.85rem;
  letter-spacing: 1px;
  transition: color 0.2s;
  padding: 8px 16px;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.06);
}

.social-link:hover {
  color: #F5A623;
  border-color: rgba(108,43,217,0.3);
}

.footer {
  position: absolute;
  bottom: 24px;
  color: #444;
  font-size: 0.75rem;
  letter-spacing: 2px;
  z-index: 1;
}

@media (max-width: 480px) {
  .logo { font-size: 2.5rem; }
  h1 { font-size: 1.6rem; }
}
</style>
<meta http-equiv="last-modified" content="2026-08-23T12:15:00Z">
</head>
<body>
<div class="container">
  <div class="logo">agencja<span class="dot">.</span>fun</div>
  <div class="tagline">digital agency</div>

  <div class="status-badge">🚧 w budowie</div>
  <h1>Już wkrótce</h1>
  <p>Pracujemy nad czymś świeżym.<br>Zostaw kontakt — damy znać jak wystartujemy.</p>

  <div class="social-links">
    <a href="https://instagram.com/wojdatomek" class="social-link" target="_blank">📷 Instagram</a>
    <a href="mailto:hello@agencja.fun" class="social-link">✉️ hello@agencja.fun</a>
  </div>
</div>

<div class="footer">agencja.fun &mdash; 2026</div>
</body>
</html>
